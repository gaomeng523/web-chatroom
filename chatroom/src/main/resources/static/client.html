<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover：让页面铺进 iPhone 的刘海 / 圆角区域，避让交给 CSS 的 env(safe-area-inset-*)。
         interactive-widget=resizes-content：Android Chrome 弹键盘时压缩"布局视口"，
         这样 100dvh 会跟着变小、输入框不会被键盘盖住（iOS 不支持这个值，由 client.js 的 visualViewport 兜底）。 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>网页聊天室</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/client.css">
</head>
<body>
    <!-- ============================================================
         图标库
         全部图标集中在这里定义一次，用 <svg class="icon"><use href="#i-xxx"/></svg> 引用。
         这么做的原因：
           1) 不用 emoji —— emoji 在不同系统渲染差别很大（Windows 是彩色扁平、
              macOS 是拟物），而且一眼就是"随手糊的页面"；
           2) 不用图标字体（要额外请求一个字体文件，还容易闪）；
           3) 内联 SVG 直接跟着 currentColor 走，hover 换色、描边粗细都由 CSS 控制。
         每个 symbol 上带 stroke="currentColor"，即使外层 .icon 的样式没加载上也不会变成黑块。
         JS 里动态拼的 HTML（如群头像）也在引用这里的 id，删 symbol 前先全局搜一下 id。
         ============================================================ -->
    <svg class="sprite" aria-hidden="true" focusable="false">
        <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </symbol>
        <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
        </symbol>
        <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
        </symbol>
        <symbol id="i-smile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9"/>
            <line x1="15" y1="9" x2="15.01" y2="9"/>
        </symbol>
        <symbol id="i-user-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
        </symbol>
        <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </symbol>
        <!-- 移动端"返回会话列表"用。桌面端这个按钮是 display:none，见 client.css -->
        <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </symbol>
    </svg>

    <div class="client-container">
        <div class="main">
            <!-- 左侧边栏 -->
            <div class="left">
                <div class="user-info">
                    <!-- 点击头像可更换，真正的文件选择交给下面的隐藏 input -->
                    <div class="avatar" id="user-avatar" title="点击更换头像"></div>
                    <div class="username" id="user-name">加载中...</div>
                </div>
                <div class="search">
                    <!-- 同一个输入框，两个按钮：搜索用户 / 搜索聊天记录 -->
                    <input type="text" id="search-input" placeholder="搜索用户 / 聊天记录..."
                           enterkeyhint="search">
                    <button id="search-btn" title="搜索用户" aria-label="搜索用户">
                        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
                    </button>
                    <button id="search-msg-btn" title="搜索聊天记录" aria-label="搜索聊天记录">
                        <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
                    </button>
                </div>
                <div class="tab">
                    <div class="tab-session active" id="tab-session">
                        <span class="tab-icon"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-chat"/></svg></span>
                        <span>会话</span>
                    </div>
                    <div class="tab-friend" id="tab-friend">
                        <span class="tab-icon"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-users"/></svg></span>
                        <span>好友</span>
                    </div>
                </div>
                <ul class="list" id="session-list"></ul>
                <!-- 好友面板：上方是待处理的好友请求，下方是好友列表 -->
                <div class="friend-panel hide" id="friend-panel">
                    <div class="request-section hide" id="request-section">
                        <div class="section-title">
                            <span>新的朋友</span>
                            <span class="request-count" id="request-count">0</span>
                        </div>
                        <ul class="request-list" id="request-list"></ul>
                    </div>
                    <div class="friend-toolbar">
                        <span class="toolbar-title">好友</span>
                        <button class="toolbar-btn" id="group-create-btn">发起群聊</button>
                    </div>
                    <ul class="list" id="friend-list"></ul>
                    <!-- 多选模式下的操作条：建群填群名，邀请入群时群名输入框会隐藏 -->
                    <div class="group-bar hide" id="group-bar">
                        <input type="text" id="group-name-input" class="group-name-input"
                               placeholder="输入群名称" maxlength="64">
                        <div class="group-bar-row">
                            <span class="group-selected-tip" id="group-selected-tip">已选 0 人</span>
                            <button class="group-cancel" id="group-cancel-btn">取消</button>
                            <button class="group-confirm" id="group-confirm-btn">创建</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 右侧聊天区域 -->
            <div class="right">
                <div class="title">
                    <!-- 移动端才有：回到会话列表（桌面端由 CSS 隐藏）。点击走 history.back()，
                         所以手机的系统返回键和这个按钮是同一套逻辑，见 client.js 的 initMobileNav。 -->
                    <button class="back-btn" id="back-btn" type="button" aria-label="返回会话列表">
                        <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
                    </button>
                    <span class="chat-title-name" id="chat-title">选择一个会话开始聊天</span>
                    <!-- 群聊时这里会出现"邀请 / 退出群聊"按钮 -->
                    <span class="title-actions" id="title-actions"></span>
                    <span class="chat-status" id="chat-status"></span>
                </div>
                <div class="message-show" id="message-show">
                    <div class="empty-state" id="empty-state">
                        <div class="empty-icon">
                            <svg class="icon icon-lg" aria-hidden="true"><use href="#i-chat"/></svg>
                        </div>
                        <p>选择左侧的会话或好友，开始聊天吧</p>
                    </div>
                </div>
                <!-- composer：输入框和工具栏合成"一个"盒子。
                     两者分别只画半圈圆角、中间不画横线，聚焦时整圈一起变强调色。
                     CSS 是按 .composer > .message-input / .ctrl 选的，少套这一层样式会完全不生效。 -->
                <div class="composer">
                    <div class="message-input">
                        <div class="emoji-panel hide" id="emoji-panel"></div>
                        <!-- enterkeyhint="enter"：手机键盘右下角显示"换行"而不是"发送"。
                             触屏上 Enter 只换行、不发送 —— 否则用户想换行却把消息发出去了，见 client.js 的 initSendButton。 -->
                        <textarea id="message-textarea" placeholder="输入消息..."
                                  enterkeyhint="enter"></textarea>
                    </div>
                    <div class="ctrl">
                        <div class="ctrl-tools">
                            <button class="tool-btn" id="emoji-btn" title="表情" aria-label="表情">
                                <svg class="icon" aria-hidden="true"><use href="#i-smile"/></svg>
                            </button>
                            <button class="tool-btn" id="image-btn" title="发送图片" aria-label="发送图片">
                                <svg class="icon" aria-hidden="true"><use href="#i-image"/></svg>
                            </button>
                        </div>
                        <span class="hint">Enter 发送，Shift+Enter 换行</span>
                        <button id="send-btn">发 送</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 两个隐藏的文件选择框：头像用、聊天图片用 -->
    <input type="file" id="avatar-file" class="hide-file"
           accept="image/png,image/jpeg,image/gif,image/webp">
    <input type="file" id="chat-image-file" class="hide-file"
           accept="image/png,image/jpeg,image/gif,image/webp">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
