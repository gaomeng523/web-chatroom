<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 同登录页：interactive-widget 让 Android Chrome 弹键盘时压缩布局视口，卡片重新居中 -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>注册 - 网页聊天室</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <!-- 图标定义：和 client.html / login.html 是同一套 -->
    <svg class="sprite" aria-hidden="true" focusable="false">
        <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </symbol>
        <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </symbol>
    </svg>

    <div class="nav">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg></span>
        <span>网页聊天室</span>
    </div>
    <div class="container">
        <div class="register-card">
            <div class="register-header">
                <div class="logo"><svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg></div>
                <h3>创建账号</h3>
                <p>注册一个新账号，加入聊天室</p>
            </div>
            <div class="register-body">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" class="input-field" placeholder="请输入用户名（最多20位）">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" class="input-field" placeholder="请输入密码（6~20位）">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirmPassword" class="input-field" placeholder="请再次输入密码">
                </div>
                <div class="form-tip hide" id="tip"></div>
                <button id="submit" class="register-btn">注 册</button>
            </div>
            <div class="register-footer">已有账号？<a href="login.html">去登录</a></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        let submitButton = document.querySelector('#submit');
        let usernameInput = document.querySelector('#username');
        let passwordInput = document.querySelector('#password');
        let confirmInput = document.querySelector('#confirmPassword');
        let tipBox = document.querySelector('#tip');

        // 与后端 UserRegisterRequest 的校验规则保持一致
        const USERNAME_MAX = 20;
        const PASSWORD_MIN = 6;
        const PASSWORD_MAX = 20;

        function showTip(message, type) {
            tipBox.innerHTML = message;
            tipBox.className = 'form-tip ' + (type === 'success' ? 'tip-success' : 'tip-error');
        }

        function hideTip() {
            tipBox.className = 'form-tip hide';
        }

        function setLoading(loading) {
            submitButton.disabled = loading;
            submitButton.innerHTML = loading ? '注册中...' : '注 册';
        }

        // 前端先校验一遍，规则和后端 @NotBlank / @Size 对齐
        function validate(username, password, confirmPassword) {
            if (!username) return '请输入用户名！';
            if (username.length > USERNAME_MAX) return '用户名长度不能超过' + USERNAME_MAX + '位！';
            if (!password) return '请输入密码！';
            if (password.length < PASSWORD_MIN || password.length > PASSWORD_MAX) {
                return '密码长度需在' + PASSWORD_MIN + '~' + PASSWORD_MAX + '位之间！';
            }
            if (password !== confirmPassword) return '两次输入的密码不一致！';
            return null;
        }

        [usernameInput, passwordInput, confirmInput].forEach(function(input) {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') submitButton.click();
            });
        });

        submitButton.onclick = function() {
            let username = usernameInput.value.trim();
            let password = passwordInput.value;
            let confirmPassword = confirmInput.value;
            hideTip();

            let error = validate(username, password, confirmPassword);
            if (error) { showTip(error, 'error'); return; }

            setLoading(true);
            $.ajax({
                method: 'post',
                url: '/user/register',
                contentType: 'application/json',
                data: JSON.stringify({ username: username, password: password }),
                success: function(data) {
                    // 失败一律走下面的 error 回调（后端业务异常现在返回真 400，例如"用户名已存在"），
                    // 所以这里只需要判断成功
                    if (data && data.username) {
                        showTip('注册成功，正在跳转到登录页...', 'success');
                        setTimeout(function() { location.assign('/login.html'); }, 800);
                    } else {
                        showTip('注册失败！', 'error');
                        setLoading(false);
                    }
                },
                error: function(xhr) {
                    // 同 login.html：业务异常（用户名已存在）现在返回真 400 + {code, message}，
                    // 优先显示后端给的原因，别盖成笼统的"请求参数有误"
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        showTip(xhr.responseJSON.message, 'error');
                    } else if (xhr.status === 400) {
                        showTip('请求参数有误！', 'error');
                    } else if (xhr.status === 404) {
                        showTip('接口不存在，请检查后端服务！', 'error');
                    } else if (xhr.status === 415) {
                        showTip('请求格式错误，请检查 Content-Type！', 'error');
                    } else {
                        showTip('网络错误，请稍后重试！', 'error');
                    }
                    setLoading(false);
                }
            });
        }
    </script>
</body>
</html>
